services:
  musicassistant<__instance>:
    container_name: ${MUSICASSISTANT<__INSTANCE>__CONTAINER_NAME?}
    env_file: .env.app.musicassistant<__instance>
    environment:
      - TZ=${TZ?}
    restart: ${MUSICASSISTANT<__INSTANCE>__RESTART?}
    cap_add:
      - SYS_ADMIN
      - DAC_READ_SEARCH
    security_opt:
      - apparmor:unconfined
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${DOCKER_VOLUME_CONFIG?}/musicassistant<__instance>:/data
