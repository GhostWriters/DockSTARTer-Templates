[ND_LOGLEVEL]
helpline = "Logging verbosity level."

[[ND_LOGLEVEL.options]]
value = "'error'"
label = "Error"
help = "Only log errors."

[[ND_LOGLEVEL.options]]
value = "'warn'"
label = "Warn"
help = "Log errors and warnings."

[[ND_LOGLEVEL.options]]
value = "'info'"
label = "Info"
help = "Standard logging (recommended)."

[[ND_LOGLEVEL.options]]
value = "'debug'"
label = "Debug"
help = "Verbose output for troubleshooting."

[ND_DEFAULTTHEME]
helpline = "Default UI theme for new users."

[[ND_DEFAULTTHEME.options]]
value = "'Dark'"
label = "Dark"

[[ND_DEFAULTTHEME.options]]
value = "'Light'"
label = "Light"

[[ND_DEFAULTTHEME.options]]
value = "'Auto'"
label = "Auto"
help = "Follow the browser/OS preference."

[ND_ALBUMPLAYCOUNTMODE]
helpline = "How album play counts are calculated."

[[ND_ALBUMPLAYCOUNTMODE.options]]
value = "'absolute'"
label = "Absolute"
help = "Count each track play separately."

[[ND_ALBUMPLAYCOUNTMODE.options]]
value = "'normalized'"
label = "Normalized"
help = "Normalize play counts by track count."

[ND_DEFAULTDOWNSAMPLINGFORMAT]
helpline = "Audio format used when downsampling/transcoding on download."

[[ND_DEFAULTDOWNSAMPLINGFORMAT.options]]
value = "'opus'"
label = "Opus"
help = "Best quality at low bitrates (recommended)."

[[ND_DEFAULTDOWNSAMPLINGFORMAT.options]]
value = "'mp3'"
label = "MP3"
help = "Widest compatibility."

[[ND_DEFAULTDOWNSAMPLINGFORMAT.options]]
value = "'aac'"
label = "AAC"
help = "Good quality, Apple device friendly."

[[ND_DEFAULTDOWNSAMPLINGFORMAT.options]]
value = "'flac'"
label = "FLAC"
help = "Lossless — large files."

[ND_SCANNER_PURGEMISSING]
helpline = "When to remove missing tracks from the library."

[[ND_SCANNER_PURGEMISSING.options]]
value = "'never'"
label = "Never"
help = "Keep missing tracks in library."

[[ND_SCANNER_PURGEMISSING.options]]
value = "'auto'"
label = "Auto"
help = "Remove after several consecutive scans."

[[ND_SCANNER_PURGEMISSING.options]]
value = "'strict'"
label = "Strict"
help = "Remove immediately when not found."

[ND_SESSIONTIMEOUT]
helpline = "How long before idle user sessions expire (e.g., 24h, 48h, 720h)."

[ND_ENABLESHARING]
helpline = "Allow generating time-limited public share links for playlists and albums."

[ND_ENABLEREPLAYGAIN]
helpline = "Apply ReplayGain volume normalization across tracks."

[ND_AUTOTRANSCODEDOWNLOAD]
helpline = "Automatically transcode downloads to the downsampling format."
