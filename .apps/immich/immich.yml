services:
  immich<__instance>:
    container_name: ${IMMICH<__INSTANCE>__CONTAINER_NAME?}
    depends_on:
      - immich<__instance>-postgres
      - immich<__instance>-redis
      - immich<__instance>-ml
    env_file:
      - .env.app.immich<__instance>-database
      - .env.app.immich<__instance>
    environment:
      - TZ=${TZ?}
    restart: ${IMMICH<__INSTANCE>__RESTART?}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${IMMICH<__INSTANCE>__VOLUME_UPLOAD_LOCATION?}:/data
  immich<__instance>-ml:
    container_name: ${IMMICH<__INSTANCE>___ML__CONTAINER_NAME?}
    env_file: .env.app.immich<__instance>
    environment:
      - TZ=${TZ?}
    restart: ${IMMICH<__INSTANCE>___ML__RESTART?}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${DOCKER_VOLUME_CONFIG?}/immich<__instance>-model-cache:/cache
  immich<__instance>-postgres:
    container_name: ${IMMICH<__INSTANCE>___POSTGRES__CONTAINER_NAME?}
    env_file:
      - .env.app.immich<__instance>-database
      - .env.app.immich<__instance>___postgres
    environment:
      - POSTGRES_INITDB_ARGS=--data-checksums
      - TZ=${TZ?}
    restart: ${IMMICH<__INSTANCE>___POSTGRES__RESTART?}
    shm_size: 128mb
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${DOCKER_VOLUME_CONFIG?}/immich<__instance>-postgres:/var/lib/postgresql/data
  immich<__instance>-redis:
    container_name: ${IMMICH<__INSTANCE>___REDIS__CONTAINER_NAME?}
    environment:
      - TZ=${TZ?}
    restart: ${IMMICH<__INSTANCE>___REDIS__RESTART?}
    volumes:
      - /etc/localtime:/etc/localtime:ro
volumes:
  immich<__instance>-model-cache:
