services:
  forgejo<__instance>:
    container_name: ${FORGEJO<__INSTANCE>__CONTAINER_NAME?}
    env_file: .env.app.forgejo<__instance>
    environment:
      - TZ=${TZ?}
      - USER_GID=${PGID?}
      - USER_UID=${PUID?}
    restart: ${FORGEJO<__INSTANCE>__RESTART?}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - ${DOCKER_VOLUME_CONFIG?}/forgejo<__instance>:/data
