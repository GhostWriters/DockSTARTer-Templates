services:
  crafty<__instance>:
    container_name: ${CRAFTY<__INSTANCE>__CONTAINER_NAME?}
    env_file: .env.app.crafty<__instance>
    environment:
      - TZ=${TZ?}
    restart: ${CRAFTY<__INSTANCE>__RESTART?}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${DOCKER_VOLUME_CONFIG?}/crafty<__instance>/backups:/crafty/backups
      - ${DOCKER_VOLUME_CONFIG?}/crafty<__instance>/config:/crafty/app/config
      - ${DOCKER_VOLUME_CONFIG?}/crafty<__instance>/import:/crafty/import
      - ${DOCKER_VOLUME_CONFIG?}/crafty<__instance>/logs:/crafty/logs
      - ${DOCKER_VOLUME_CONFIG?}/crafty<__instance>/servers:/crafty/servers
