services:
  wizarr<__instance>:
    container_name: ${WIZARR<__INSTANCE>__CONTAINER_NAME?}
    env_file: .env.app.wizarr<__instance>
    environment:
      - PGID=${PGID?}
      - PUID=${PUID?}
      - TZ=${TZ?}
    restart: ${WIZARR<__INSTANCE>__RESTART?}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${DOCKER_VOLUME_CONFIG?}/wizarr<__instance>:/data
