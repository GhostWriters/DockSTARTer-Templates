services:
  metube<__instance>:
    container_name: ${METUBE<__INSTANCE>__CONTAINER_NAME?}
    env_file: .env.app.metube<__instance>
    environment:
      - PGID=${PGID?}
      - PUID=${PUID?}
      - TZ=${TZ?}
    restart: ${METUBE<__INSTANCE>__RESTART?}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${DOCKER_VOLUME_CONFIG?}/metube<__instance>:/config
