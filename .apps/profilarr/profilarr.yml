services:
  profilarr<__instance>:
    container_name: ${PROFILARR<__INSTANCE>__CONTAINER_NAME?}
    env_file: .env.app.profilarr<__instance>
    environment:
      - PGID=${PGID?}
      - PUID=${PUID?}
      - TZ=${TZ?}
    restart: ${PROFILARR<__INSTANCE>__RESTART?}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${DOCKER_VOLUME_CONFIG?}/profilarr<__instance>:/config
