[LOG_LEVEL]
helpline = "Logging verbosity level."

[[LOG_LEVEL.options]]
value = "':info'"
label = "Info"
help = "Standard logging (recommended)."

[[LOG_LEVEL.options]]
value = "':debug'"
label = "Debug"
help = "Verbose output for troubleshooting."

[[LOG_LEVEL.options]]
value = "':warn'"
label = "Warn"

[[LOG_LEVEL.options]]
value = "':error'"
label = "Error"

[DISCORD__TOKEN]
helpline = "Discord bot token from the Discord Developer Portal."

[DISCORD__REQUESTED_MSG_STYLE]
helpline = "Style of the Discord request confirmation message."

[[DISCORD__REQUESTED_MSG_STYLE.options]]
value = "':plain'"
label = "Plain"
help = "Simple text message."

[[DISCORD__REQUESTED_MSG_STYLE.options]]
value = "':embed'"
label = "Embed"
help = "Rich embed with poster art."

[DISCORD__MAX_RESULTS]
helpline = "Maximum number of search results shown in Discord."

[PARTIAL_SEASONS]
helpline = "Allow requesting individual seasons rather than whole series."

[[PARTIAL_SEASONS.options]]
value = "'true'"
label = "Enabled"

[[PARTIAL_SEASONS.options]]
value = "'false'"
label = "Disabled"

